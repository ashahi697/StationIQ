
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StationIQ | Sales</title>

    <link rel="stylesheet" href="/static/stationIQ.css">
    <link rel="stylesheet" href="/static/sales.css">
    <script src="/static/sales.js" defer></script>
</head>

<body>
    <aside class="sidebar">
        <h2>StationIQ</h2>
        <nav>
            <a href="/">Dashboard</a>
            <a href="/sales" class="active">Sales</a>
            <a href="/fuel">Fuel</a>
            <a href="/inventory">Inventory</a>
            <a href="#">Expenses</a>
        </nav>
    </aside>

    <main class="sales-page">
        <header class="sales-header">
            <div>
                <h1>Sales Management</h1>
                <p>Sunset Fast Stop | Daily Sales Records</p>
            </div>
            <img src="/static/shellLogo.png" alt="Shell Logo">
        </header>

        <section class="sales-panel">
            <h2>Add Daily Sales</h2>

            <form id="salesForm" novalidate>
                <div class="sales-fields">
                    <div>
                        <label for="saleDate">Date</label>
                        <input type="date" id="saleDate">
                    </div>

                    <div>
                        <label for="insideSales">Inside Sales ($)</label>
                        <input type="number" id="insideSales"
                               step="any">
                    </div>

                    <div>
                        <label for="fuelSales">Fuel Sales ($)</label>
                        <input type="number" id="fuelSales"
                               step="any">
                    </div>
                </div>

                <button type="submit">Save Sales Entry</button>
                <p id="salesMessage" role="status"></p>
            </form>
        </section>

        <section class="sales-panel">
            <h2>Sales History</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Inside Sales</th>
                            <th>Fuel Sales</th>
                            <th>Total</th>
                            <th>Inside Gross Profit</th>
                        </tr>
                    </thead>
                    <tbody id="salesHistory"></tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
