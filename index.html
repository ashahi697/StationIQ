
<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Buffosphere Bunbuff Simulation</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">

      // React component for a single cell in the island grid
        const IslandCell = ({ row, col, occupants }) => {
            return (
              <div style={{ border: '1px solid black', minHeight: '70px', padding: '6px' }}>
                <strong>({row}, {col})</strong>
                {occupants.map(b => ( // Display each bunbuff in the cell
                  <div key={b.id} style={{ border: '1px solid #007bff', background: '#e6f0ff', marginTop: '2px', padding: '2px', borderRadius: '3px' }}>
                    Bunbuff ID: {b.id}, Age: {b.age}, Aggression: {b.aggression}
                  </div>
                ))}
              </div>
            );
        };

      // React component for the entire island grid
        const IslandGrid = ({ rows, cols, bunbuffs}) => {
          let grid = [];
          for (let r = 0; r < rows; r++) {
            let gridCols = [];
            for (let c = 0; c < cols; c++) {
              // Filter bunbuffs that are in this cell
              const occupants = bunbuffs.filter(b => b.row === r && b.col === c);
              gridCols.push( // Render each cell with its occupants
                <IslandCell key={`${r}-${c}`} row={r} col={c} occupants={occupants} />
              );
            }
            grid.push( // Render each row of the grid
              <div key={`row-${r}`} style={{ display: 'grid', gridTemplateColumns: `repeat(${cols}, 1fr)`, gap: '4px', marginBottom: '4px' }}>
                {gridCols}
              </div>
            );
          }
            return ( // Render the entire grid
                <div>
                  {grid}
                </div>
            );
        };

      // Main application component
      function MyApp() {

        // State variables for simulation parameters
        const [rows, setRows] = React.useState(5);
        const [cols, setCols] = React.useState(5);
        const [bunbuffs, setBunbuffs] = React.useState([]);
        const [initialBunbuffCount, setInitialBunbuffCount] = React.useState(10);
        const [maxLifespan, setMaxLifespan] = React.useState(12);
        const [maxLitterSize, setMaxLitterSize] = React.useState(3);
        const [minAggression, setMinAggression] = React.useState(10);
        const [maxAggression, setMaxAggression] = React.useState(50);

        // State variables for simulation control and statistics
        const [currentStep, setCurrentStep] = React.useState(0);
        const [totalPopulation, setTotalPopulation] = React.useState(0);
        const [logs, setLogs] = React.useState(["[System] Simulation started."]);

        const handleStartSimulation = () => {
          // Logic to initialize the simulation with the given parameters
          // This would include creating initial bunbuffs and setting up the grid
          if (minAggression > maxAggression) {
            alert("Minimum aggression cannot exceed maximum aggression.");
            return;
          }
          let startingBunbuffs = startSimulation(rows, cols, initialBunbuffCount, minAggression, maxAggression);
          setBunbuffs(startingBunbuffs);
          setCurrentStep(0);
          setTotalPopulation(startingBunbuffs.length);
          setLogs(["[System] Simulation started."]);
        };

        const handleAdvanceStep = () => {
          // Logic to advance the simulation by one month
          if (bunbuffs.length === 0) return;

          let updatedPopulation = simulateStep(bunbuffs, rows, cols, maxLifespan, maxLitterSize, minAggression, maxAggression);

          let stats = getSimulationStats(updatedPopulation);
          setCurrentStep(stats.currentStep);
          setTotalPopulation(stats.totalBorn);
          setBunbuffs(updatedPopulation);
          setLogs(stats.events);
        };

        return (
          <div>
            <h1>Buffosphere Bunbuff Simulation</h1>

            {/* These are the simulation parameters that can be adjusted by the user. */}
            <fieldset>
              <legend> Simulation Parameters </legend>
              <label>Grid Rows (M): <input type="number" value={rows} onChange={e => setRows(parseInt(e.target.value) || 1)} min="1" /></label><br/>
              <label>Grid Columns (N): <input type="number" value={cols} onChange={e => setCols(parseInt(e.target.value) || 1)} min="1" /></label><br/>
              <label>Initial Bunbuff Count: <input type="number" value={initialBunbuffCount} onChange={e => setInitialBunbuffCount(parseInt(e.target.value) || 1)} min="1" /></label><br/>
              <label>Max Lifespan (Months): <input type="number" value={maxLifespan} onChange={e => setMaxLifespan(parseInt(e.target.value) || 1)} min="1" /></label><br/>
              <label>Max Litter Size: <input type="number" value={maxLitterSize} onChange={e => setMaxLitterSize(parseInt(e.target.value) || 1)} min="1" /></label><br/>
              <label>Min Aggression Level: <input type="number" value={minAggression} onChange={e => setMinAggression(parseInt(e.target.value) || 1)} min="1" max="99"/></label><br/>
              <label>Max Aggression Level: <input type="number" value={maxAggression} onChange={e => setMaxAggression(parseInt(e.target.value) || 1)} min="1" max="99"/></label><br/>
              <button onClick={handleStartSimulation}>Start/Restart Simulation</button>
            </fieldset>

            {/* This button will advance the simulation by one month. */}
            <div style={{ marginBottom: '15px' }} />
              <button id="btn-step" onClick={handleAdvanceStep} disabled={bunbuffs.length === 0}>
                Advance Simulation by One Month
              </button>

            {/* Summary statistics for the simulation. */}
          <fieldset style={{maxWidth: '500px', marginTop: '15px'}}>
            <legend>Summary Statistics</legend>
            <p>Current Simulation Step: <span id="stat-step">{currentStep}</span></p>
            <p>Average Births per Month: <span>{getSimulationStats(bunbuffs).averageBirths.toFixed(2)}</span></p>
            <p>Average Deaths per Month: <span>{getSimulationStats(bunbuffs).averageDeaths.toFixed(2)}</span></p>
            <p>Average Lifespan: <span>{getSimulationStats(bunbuffs).averageLifespan.toFixed(2)}</span></p>
            <p>Current Bunbuff Population: <span id="stat-current-pop">{bunbuffs.length}</span></p>
            <p>Total Bunbuffs Born: <span id="stat-total-pop">{totalPopulation}</span></p>
            </fieldset>

            {/* The island grid represents the environment where Bunbuffs live. */}
            <h2>Island Grid</h2>
            <IslandGrid rows={rows} cols={cols} bunbuffs={bunbuffs} />

            {/* The event log records significant simulation events. */}
            <h2>Event Log</h2>
            <div id="log-container" style={{ border: '1px solid black', padding: '10px', maxHeight: '200px', overflowY: 'scroll' }}>
              {logs.map((log, index) => (
                <div key={index}>{log}</div>))}
            </div>
          </div>
        );
      }

    // Render the main application component into the root div
      const container = document.getElementById('root');
      const root = ReactDOM.createRoot(container);
      root.render(<MyApp />);
    </script>

  </body>
</html>
